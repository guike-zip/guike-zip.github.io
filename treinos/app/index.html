<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><title>Tingui Skills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone app. Sticky header, scrolling content, fixed bottom tab bar. */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --surface2: #EEF2F7;
  --ink: #1C2B40; --ink2: #93A3B8; --muted: #5B6B80; --line: #D9E0E9;
  --accent: #E07A1F; --accent-soft: #FCEBDD; --on-accent: #FFFFFF;
  --good: #2E8B57; --good-soft: #E1F2E8; --bad: #C0392B; --bad-soft: #F8E1DE; --warn: #B7791F; --warn-soft: #FBF0D9;
  --equip: #7C8794; --bench: #E3E8EF;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1620; --surface: #18222F; --surface2: #1F2B3A;
  --ink: #E8EDF3; --ink2: #5F7189; --muted: #A6B3C4; --line: #2A3647;
  --accent: #F08A2E; --accent-soft: #3A2A1A; --on-accent: #0F1620;
  --good: #4FBF80; --good-soft: #1B3328; --bad: #E2675A; --bad-soft: #3A2220; --warn: #D9A441; --warn-soft: #3A3120;
  --equip: #8A96A6; --bench: #2A3647; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1620; --surface: #18222F; --surface2: #1F2B3A;
  --ink: #E8EDF3; --ink2: #5F7189; --muted: #A6B3C4; --line: #2A3647;
  --accent: #F08A2E; --accent-soft: #3A2A1A; --on-accent: #0F1620;
  --good: #4FBF80; --good-soft: #1B3328; --bad: #E2675A; --bad-soft: #3A2220; --warn: #D9A441; --warn-soft: #3A3120;
  --equip: #8A96A6; --bench: #2A3647; color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
input:focus, button:focus-visible, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }

.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.hdr .sub { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

main { padding: 14px 16px calc(84px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-width: 720px; margin: 0 auto; }
.tab { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.accent { border-color: var(--accent); }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.on { background: var(--accent-soft); color: var(--accent); }

.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.check:first-of-type { border-top: 0; }
.check input { width: 22px; height: 22px; margin: 2px 0 0; flex: 0 0 auto; accent-color: var(--accent); }
.check label { flex: 1; min-width: 0; }
.check .t { font-weight: 600; }
.check.done .t { text-decoration: line-through; color: var(--muted); }

.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.figs.three { grid-template-columns: repeat(3, 1fr); }
.figs.four { grid-template-columns: 1fr 1fr; }
.figbox { background: var(--surface2); border-radius: 10px; padding: 6px 6px 8px; display: grid; gap: 4px; min-width: 0; }
.figbox .cap { font-size: 11.5px; line-height: 1.25; font-weight: 600; color: var(--muted); text-align: center; }
.figbox .cap.bad { color: var(--bad); }
.fig { width: 100%; height: auto; display: block; }

details { border-top: 1px solid var(--line); }
details:first-of-type { border-top: 0; }
summary { list-style: none; cursor: pointer; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--display); font-size: 20px; color: var(--muted); flex: 0 0 auto; }
details[open] summary::after { content: "–"; }
.body { display: grid; gap: 10px; padding: 0 0 14px; }
ol, ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
tr.hl td { background: var(--accent-soft); }
.twrap { overflow-x: auto; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface2); border-radius: 10px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: 22px; }
.kpi .l { font-size: 11.5px; color: var(--muted); }

.timer { display: grid; justify-items: center; gap: 8px; padding: 6px 0; }
.timer .t { font-family: var(--display); font-weight: 700; font-size: 52px; letter-spacing: .02em; }
.bar { height: 8px; background: var(--surface2); border-radius: 999px; overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

.phase { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 6px; }
.phase.cur { border-left-color: var(--accent); }
.phase .ph { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }

.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.testrow { display: grid; grid-template-columns: 1fr 86px; gap: 10px; align-items: end; padding: 8px 0; border-top: 1px solid var(--line); }
.testrow:first-of-type { border-top: 0; }
.testrow .how { font-size: 12.5px; color: var(--muted); }
.spark { width: 100%; height: 70px; display: block; }

.subtabs { display: flex; gap: 6px; background: var(--surface2); padding: 4px; border-radius: 12px; }
.subtabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px; font-family: var(--display); font-weight: 600; font-size: 15px; cursor: pointer; color: var(--muted); }
.subtabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
nav.tabs button { flex: 1; border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 4px 0; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; }
nav.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 600px) { .figs.four { grid-template-columns: repeat(4, 1fr); } .kpis { grid-template-columns: repeat(6, 1fr); } }
</style>

<header class="hdr">
  <div>
    <h1>Tingui Skills</h1>
    <p class="sub" id="hdrSub">Muscle-up e handstand walk</p>
  </div>
  <div class="chips" id="hdrChips"></div>
</header>

<main>
  <section class="tab" id="tab-hoje"></section>
  <section class="tab" id="tab-semana" hidden></section>
  <section class="tab" id="tab-trilhas" hidden></section>
  <section class="tab" id="tab-exercicios" hidden></section>
  <section class="tab" id="tab-eu" hidden></section>
</main>

<nav class="tabs" id="nav">

  <button data-tab="semana"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Semana</button>

  <button data-tab="eu"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Eu</button>
</nav>
<div class="toast" id="toast"></div>

// ---------------------------------------------------------------- state
const KEY = "tingui.skills.v1";
let S = { mu: 0, hs: 0, lean: 71, weight: 93, waist: "", log: [], tests: {}, done: {}, hsSec: {}, sub: "mu" };

const $ = (q, el = document) => el.querySelector(q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);

function figbox(pair, bad) { return `<div class="figbox">${pair[1]}<div class="cap${bad ? " bad" : ""}">${esc(pair[0])}</div></div>`; }
function exFigs(k) { const p = FIGS[k]; if (!p) return ""; return `<div class="figs">${figbox(p[0])}${figbox(p[1], k === "Prancha")}</div>`; }

// ---------------------------------------------------------------- header
function renderHeader() {

// ---------------------------------------------------------------- hoje
let timer = { run: false, start: 0, base: 0, id: null };
function hsToday() { return (S.hsSec[today()] || 0) + (timer.run ? Math.floor((Date.now() - timer.start) / 1000) : 0); }
function renderHoje() {

  const mu = MU[S.mu]; const hs = HS[S.hs];

    return `<div class="check${done.includes(i) ? " done" : ""}"><input type="checkbox" id="chk${i}" data-i="${i}" ${done.includes(i) ? "checked" : ""}><label for="chk${i}"><div class="t">${esc(it.t)}</div><div class="muted small">${esc(s)}</div></label></div>`;
  }).join("");

  $("#tab-hoje").innerHTML = `

      <div class="row"><button class="btn primary" id="tStart">${timer.run ? "Pausar" : "Iniciar"}</button><button class="btn ghost" id="tReset">Zerar o dia</button></div></div>
    <ul class="small">${hs.daily.map(d => `<li>${esc(d)}</li>`).join("")}</ul>

    <p class="muted small">Use a média da semana, nunca o dia. Compare com a semana anterior na aba Eu.</p>

  $("#checks").addEventListener("change", e => {

}
function mmss(s) { return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function tick() { const el = $("#tmr"); if (!el) return; const sec = hsToday(); el.textContent = mmss(sec); const b = $(".bar i", $("#tab-hoje")); if (b) b.style.width = Math.min(100, sec / 900 * 100) + "%"; }

  <div class="card"><h2>Nutrição para o déficit</h2>
    <div class="kpis"><div class="kpi"><div class="v num">${kcalM.toLocaleString("pt-BR")}</div><div class="l">kcal manutenção (estim.)</div></div><div class="kpi"><div class="v num">${kcalT.toLocaleString("pt-BR")}</div><div class="l">kcal alvo (déficit 500)</div></div><div class="kpi"><div class="v num">${prot}</div><div class="l">g proteína (2 g/kg)</div></div></div>
    <ul class="small"><li>Carboidrato 250 a 300 g, concentrado em torno do treino. Não corte: barra explosiva e handstand pedem energia.</li><li>Gordura 60 a 75 g. Abaixo de 50 g mexe com hormônio.</li><li>Proteína em 4 refeições de 45 g: 200 g de frango, 5 ovos, 250 g de iogurte grego ou um scoop de whey valem 40 a 50 g cada.</li><li>Pese-se todo dia e compare médias semanais. Caiu 0,4 a 0,8 kg: não mexa. Menos de 0,3 kg por 2 semanas: tire 150 a 200 kcal. Mais de 1 kg: adicione 150.</li><li>Força na barra caindo 2 semanas seguidas com sono em dia: déficit grande demais, suba 200 kcal.</li><li>A cada 8 semanas, 1 semana na manutenção. Creatina 3 a 5 g por dia é o único suplemento que vale aqui.</li></ul></div>
  <div class="card"><h2>Testes iniciais</h2><p class="muted small">Descansado, 3 min entre testes, vídeo lateral da barra e do handstand. Refaça a cada 4 semanas. A faixa colorida interpreta o resultado para o seu caso.</p>${tests}</div>
  <div class="card"><h2>Registro de peso e cintura</h2>${logs.length > 1 ? spark(logs) : `<p class="muted small">Salve o peso na aba Hoje. Com dois ou mais dias aparece o gráfico.</p>`}
    ${logs.length ? `<div class="twrap"><table><thead><tr><th>Dia</th><th>kg</th><th>cintura</th><th></th></tr></thead><tbody>${logs.slice().reverse().map(l => `<tr><td>${l.d.slice(8, 10)}/${l.d.slice(5, 7)}</td><td class="num">${l.kg ? fmtKg(l.kg) : "–"}</td><td class="num">${l.cm ? l.cm : "–"}</td><td><button class="btn sm ghost" data-del="${l.d}">×</button></td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="row"><button class="btn ghost sm" id="clearAll">Apagar todos os dados do app</button></div></div>
  <div class="card"><h3>Acompanhamento</h3><ul class="small"><li>Peso: diário, média semanal.</li><li>Cintura no umbigo: semanal, relaxado, fim da expiração.</li><li>Fotos padrão a cada 4 semanas: frente, lado e costas, de short, mesma luz, braços relaxados.</li><li>Testes a cada 4 semanas, fim de bloco.</li><li>Composição corporal agora e a cada 3 meses.</li><li>Carga da barra com carga: toda sessão. Deve subir ou manter enquanto o peso cai.</li></ul></div>`;
  $("#leanIn").onchange = e => { S.lean = parseFloat(e.target.value) || S.lean; save(); renderHeader(); renderEu(); };
  $("#wNow").onchange = e => { S.weight = parseFloat(e.target.value) || S.weight; save(); renderHeader(); renderEu(); };
  $("#tab-eu").querySelectorAll("[data-t]").forEach(el => el.onchange = () => { S.tests[el.dataset.t] = el.value; save(); renderEu(); });
  $("#tab-eu").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.log = S.log.filter(x => x.d !== b.dataset.del); save(); renderEu(); });
  $("#clearAll").onclick = () => { if ($("#clearAll").dataset.arm) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } else { $("#clearAll").dataset.arm = "1"; $("#clearAll").textContent = "Toque de novo para confirmar"; } };
}
function spark(logs) {
  const pts = logs.filter(l => l.kg); if (pts.length < 2) return "";
  const W = 320, H = 70, p = 8; const ks = pts.map(l => l.kg); const min = Math.min(...ks) - 0.5, max = Math.max(...ks) + 0.5;
  const x = i => p + i * (W - 2 * p) / (pts.length - 1), y = k => H - p - (k - min) / (max - min) * (H - 2 * p);
  const d = pts.map((l, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(l.kg).toFixed(1)}`).join(" ");
  const area = d + ` L${x(pts.length - 1).toFixed(1)},${H - p} L${x(0).toFixed(1)},${H - p} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(pts.length - 1)}" cy="${y(last.kg)}" r="3.5" fill="var(--accent)"/><text x="${p}" y="${p + 4}" font-size="10" fill="var(--muted)" font-family="inherit">${fmtKg(max - 0.5)}</text><text x="${p}" y="${H - 2}" font-size="10" fill="var(--muted)" font-family="inherit">${fmtKg(min + 0.5)}</text></svg>`;
}

// ---------------------------------------------------------------- nav
function show(tab) {
  document.querySelectorAll("main .tab").forEach(s => s.hidden = s.id !== "tab-" + tab);
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({ hoje: renderHoje, semana: renderSemana, trilhas: renderTrilhas, exercicios: renderEx, eu: renderEu })[tab]();
  window.scrollTo(0, 0);
}
$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.tab); };
renderHeader();
const h = (location.hash || "").slice(1);
show(["hoje", "semana", "trilhas", "exercicios", "eu"].includes(h) ? h : "hoje");
</script>
</body></html>
