<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><title>Tingui Skills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone app. Sticky header, scrolling content, fixed bottom tab bar with 3 tabs. */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --surface2: #EEF2F7;
  --ink: #1C2B40; --ink2: #93A3B8; --muted: #5B6B80; --line: #D9E0E9;
  --accent: #E07A1F; --accent-soft: #FCEBDD; --on-accent: #FFFFFF;
  --good: #2E8B57; --good-soft: #E1F2E8; --bad: #C0392B; --bad-soft: #F8E1DE; --warn: #B7791F; --warn-soft: #FBF0D9;
  --equip: #7C8794; --bench: #E3E8EF;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1620; --surface: #18222F; --surface2: #1F2B3A;
  --ink: #E8EDF3; --ink2: #5F7189; --muted: #A6B3C4; --line: #2A3647;
  --accent: #F08A2E; --accent-soft: #3A2A1A; --on-accent: #0F1620;
  --good: #4FBF80; --good-soft: #1B3328; --bad: #E2675A; --bad-soft: #3A2220; --warn: #D9A441; --warn-soft: #3A3120;
  --equip: #8A96A6; --bench: #2A3647; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1620; --surface: #18222F; --surface2: #1F2B3A;
  --ink: #E8EDF3; --ink2: #5F7189; --muted: #A6B3C4; --line: #2A3647;
  --accent: #F08A2E; --accent-soft: #3A2A1A; --on-accent: #0F1620;
  --good: #4FBF80; --good-soft: #1B3328; --bad: #E2675A; --bad-soft: #3A2220; --warn: #D9A441; --warn-soft: #3A3120;
  --equip: #8A96A6; --bench: #2A3647; color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
input:focus, button:focus-visible, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }

.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.hdr .sub { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

main { padding: 14px 16px calc(84px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-width: 720px; margin: 0 auto; }
.tab { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.accent { border-color: var(--accent); }
.card.done { opacity: .72; }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.good { background: var(--good); color: #fff; border-color: var(--good); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.big { padding: 14px; font-size: 17px; font-family: var(--display); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.on { background: var(--accent-soft); color: var(--accent); }

.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.figs.three { grid-template-columns: repeat(3, 1fr); }
.figbox { background: var(--surface2); border-radius: 10px; padding: 6px 6px 8px; display: grid; gap: 4px; min-width: 0; }
.figbox .cap { font-size: 11.5px; line-height: 1.25; font-weight: 600; color: var(--muted); text-align: center; }
.figbox .cap.bad { color: var(--bad); }
.fig { width: 100%; height: auto; display: block; }

details { border-top: 1px solid var(--line); }
details:first-of-type { border-top: 0; }
summary { list-style: none; cursor: pointer; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--display); font-size: 20px; color: var(--muted); flex: 0 0 auto; }
details[open] summary::after { content: "–"; }
.body { display: grid; gap: 10px; padding: 0 0 14px; }
ol, ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
tr.hl td { background: var(--accent-soft); }
.twrap { overflow-x: auto; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface2); border-radius: 10px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: 22px; }
.kpi .l { font-size: 11.5px; color: var(--muted); }

.timer { display: grid; justify-items: center; gap: 8px; padding: 6px 0; }
.timer .t { font-family: var(--display); font-weight: 700; font-size: 52px; letter-spacing: .02em; }
.bar { height: 8px; background: var(--surface2); border-radius: 999px; overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.bar.good i { background: var(--good); }

.sets { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 8px; }
.sets input { text-align: center; font-size: 18px; font-family: var(--display); font-weight: 600; padding: 10px 4px; }
.sets .s { display: grid; gap: 3px; justify-items: center; }
.sets .s span { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.lvl { display: flex; gap: 3px; }
.lvl i { flex: 1; height: 5px; border-radius: 3px; background: var(--surface2); }
.lvl i.on { background: var(--accent); }
.lvl i.cur { background: var(--ink); }

.phase { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 6px; }
.phase.cur { border-left-color: var(--accent); }
.phase.ok { border-left-color: var(--good); }
.phase .ph { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.crit { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 4px 0; }
.crit input { width: 20px; height: 20px; margin: 1px 0 0; flex: 0 0 auto; accent-color: var(--good); }
.crit .auto { font-size: 11px; color: var(--muted); }
.crit.ok { color: var(--good); }

.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spark { width: 100%; height: 70px; display: block; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal div { aspect-ratio: 1; border-radius: 6px; background: var(--surface2); display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.cal div.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.cal div.hs { background: var(--accent-soft); color: var(--accent); }
.cal div.today { outline: 2px solid var(--ink); }

.subtabs { display: flex; gap: 6px; background: var(--surface2); padding: 4px; border-radius: 12px; }
.subtabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px; font-family: var(--display); font-weight: 600; font-size: 15px; cursor: pointer; color: var(--muted); }
.subtabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
nav.tabs button { flex: 1; border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 4px 0; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; }
nav.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--accent); }
.rest { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; z-index: 9; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 688px; margin: 0 auto; }
.rest .t { font-family: var(--display); font-weight: 700; font-size: 28px; }
.rest button { border: 0; background: rgba(255,255,255,.15); color: inherit; border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }
.onb { display: grid; gap: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 600px) { .kpis { grid-template-columns: repeat(6, 1fr); } }
</style>

<header class="hdr">
  <div>
    <h1>Tingui Skills</h1>
    <p class="sub" id="hdrSub">Rumo ao muscle-up e ao handstand walk</p>
  </div>
  <div class="chips" id="hdrChips"></div>
</header>

<main>
  <section class="tab" id="tab-hoje"></section>
  <section class="tab" id="tab-progresso" hidden></section>
  <section class="tab" id="tab-guia" hidden></section>
</main>

<nav class="tabs" id="nav">
  <button data-tab="hoje" class="on"><svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>Hoje</button>
  <button data-tab="progresso"><svg viewBox="0 0 24 24"><path d="M4 20l5-6 4 3 7-10"/><path d="M15 7h5v5"/></svg>Progresso</button>
  <button data-tab="guia"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h12v16H6a2 2 0 00-2 2z"/><path d="M4 19a2 2 0 012-2h12"/></svg>Guia</button>
</nav>
<div class="rest" id="rest" hidden><span class="grow">Descanso</span><span class="t num" id="restT">1:30</span><button id="restPlus">+30 s</button><button id="restStop">Pular</button></div>
<div class="toast" id="toast"></div>

  A: { title: "Puxar + core", where: "Parque Tingui", warm: ["Trajeto a pé: caminhada, caminhada rápida, trote leve.", "Pendurado 2 x 15 s e escapular pull 2 x 6.", "Remada leve 2 x 8."], ex: ["pull", "row", "core", "hollow"] },
  B: { title: "Empurrar + pernas", where: "Parque Tingui", warm: ["Trajeto a pé.", "Círculos de braço, punhos no banco, 10 flexões na barra baixa.", "10 agachamentos lentos."], ex: ["dip", "push", "squat", "hinge", "back"] },
  C: { title: "Puxar explosivo + pernas", where: "Parque Tingui", warm: ["Trajeto a pé.", "Pendurado 2 x 15 s e escapular pull 2 x 6."], ex: ["pull", "row", "lunge", "calf", "core"] },
  H: { title: "Handstand + mobilidade", where: "Casa ou parque", warm: ["Punhos 3 min.", "Mobilidade de ombro 5 min."], ex: ["hollow", "lsit"], light: true },
  R: { title: "Descanso", where: "-", warm: [], ex: [] },
};
const WEEKPLAN = ["R", "A", "H", "B", "H", "C", "H"]; // Dom..Sáb
const DAYS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

// ---------------------------------------------------------------- state
const KEY = "tingui.skills.v2";
let S = { setup: false, weight: 93, lean: 71, waist: null, start: null, lvl: {}, streak: {}, sessions: [], hs: { wall: 0, free: 0, walk: 0, log: {} }, crit: {}, log: [], draft: null, tab: "hoje" };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
try { if (!S.setup) { const v1 = JSON.parse(localStorage.getItem("tingui.skills.v1") || "null"); if (v1) { S.weight = v1.weight || S.weight; S.lean = v1.lean || S.lean; S.log = v1.log || []; } } } catch (e) {}
for (const k in LIB) if (S.lvl[k] == null) S.lvl[k] = 0;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = (q, el = document) => el.querySelector(q);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const fmtKg = n => (Math.round(n * 10) / 10).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

// PR = best single-set value logged at a given ladder level (or above) for an exercise.
function pr(s, ex, level) { let best = 0; for (const se of s.sessions) for (const e of se.entries || []) if (e.ex === ex && e.lvl >= level) for (const v of e.sets) if (v > best) best = v; return best; }
function hsPhase() { const h = S.hs; if (h.walk >= 5) return 4; if (h.free >= 30) return 4; if (h.free >= 5 || critOk("hs_kick")) return 3; if (h.wall >= 60) return 2; if (h.wall >= 20) return 1; return 0; }
function critOk(k) { return !!S.crit[k]; }
function muPhase() { let ph = 0; for (let i = 0; i < MU_PH.length; i++) { const all = MU_PH[i].crit.every(c => critDone(c)); if (all) ph = i + 1; else break; } return Math.min(ph, 3); }
function critDone(c) { return (c.auto && c.auto(S)) || !!S.crit[c.k]; }
function mmss(s) { return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function figbox(pair, bad) { return `<div class="figbox">${pair[1]}<div class="cap${bad ? " bad" : ""}">${esc(pair[0])}</div></div>`; }

// ---------------------------------------------------------------- header
function renderHeader() {
  const n = S.sessions.filter(s => s.type !== "T").length; const bf = S.weight > 0 ? Math.round((1 - S.lean / S.weight) * 100) : 0;
  $("#hdrChips").innerHTML = `<span class="chip">MU fase ${muPhase() + 1}</span><span class="chip">HS fase ${hsPhase()}</span><span class="chip">${n} treino${n === 1 ? "" : "s"}</span>`;
  $("#hdrSub").textContent = S.weight ? `${fmtKg(S.weight)} kg · ~${bf}% · meta ${fmtKg(S.lean / 0.88)} a ${fmtKg(S.lean / 0.85)} kg` : "Rumo ao muscle-up e ao handstand walk";
}

// ---------------------------------------------------------------- onboarding
function renderSetup() {
  $("#tab-hoje").innerHTML = `<div class="card accent onb">
    <div class="eyebrow">Primeira vez · 2 minutos</div><h2>Onde você está hoje</h2>
    <p class="muted">Responda com o que você consegue fazer agora, estrito, descansado. Isso define o nível inicial de cada exercício. O app ajusta sozinho a partir dos treinos que você anotar.</p>
    <div class="grid2">
      <div class="field"><label for="q_pull">Barras fixas estritas (máx.)</label><input class="num" type="number" inputmode="numeric" id="q_pull" placeholder="0"></div>
      <div class="field"><label for="q_dip">Dips nas paralelas (máx.)</label><input class="num" type="number" inputmode="numeric" id="q_dip" placeholder="0"></div>
      <div class="field"><label for="q_push">Flexões no chão (máx.)</label><input class="num" type="number" inputmode="numeric" id="q_push" placeholder="0"></div>
      <div class="field"><label for="q_wall">Handstand na parede (s)</label><input class="num" type="number" inputmode="numeric" id="q_wall" placeholder="0"></div>
      <div class="field"><label for="q_w">Peso hoje (kg)</label><input class="num" type="number" inputmode="decimal" step="0.1" id="q_w" value="${S.weight}"></div>
      <div class="field"><label for="q_start">Comecei a treinar em</label><input type="date" id="q_start" value="${S.start || iso(new Date(Date.now() - 864e5))}"></div>
    </div>
    <p class="muted small">Não sabe algum número? Deixe em branco: o app começa no primeiro degrau e sobe rápido se estiver fácil.</p>
    <button class="btn primary big" id="q_go">Começar</button></div>`;
  $("#q_go").onclick = () => {
    const v = id => parseFloat($(id).value) || 0;
    const pull = v("#q_pull"), dip = v("#q_dip"), push = v("#q_push"), wall = v("#q_wall");
    S.lvl.pull = pull >= 8 ? 5 : pull >= 3 ? 4 : pull >= 1 ? 3 : 1;
    S.lvl.dip = dip >= 12 ? 4 : dip >= 5 ? 3 : dip >= 1 ? 2 : 0;
    S.lvl.push = push >= 15 ? 1 : 0;
    S.lvl.row = pull >= 5 ? 2 : pull >= 1 ? 1 : 0;
    S.lvl.core = pull >= 1 ? 2 : 0;
    S.lvl.squat = 1; S.lvl.hinge = 0;
    S.hs.wall = wall; S.weight = v("#q_w") || S.weight; S.start = $("#q_start").value || today(); S.setup = true;
    if (pull) S.sessions.push({ date: S.start, type: "T", entries: [{ ex: "pull", lvl: 4, sets: [pull] }, ...(dip ? [{ ex: "dip", lvl: 3, sets: [dip] }] : []), ...(push ? [{ ex: "push", lvl: 0, sets: [push] }] : [])], note: "Teste inicial" });
    save(); renderHeader(); renderHoje(); toast("Pronto. Nível inicial definido.");
  };
}

// ---------------------------------------------------------------- hoje (session runner)
let timer = { run: false, start: 0, id: null };
function hsToday(d) { return (S.hs.log[d]?.sec || 0) + (timer.run ? Math.floor((Date.now() - timer.start) / 1000) : 0); }
function sessionFor(date) { return WEEKPLAN[new Date(date + "T12:00:00").getDay()]; }
function renderHoje() {
  if (!S.setup) return renderSetup();
  const d = S.draft && S.draft.date ? S.draft.date : today();
  if (!S.draft || S.draft.date !== d) S.draft = { date: d, type: sessionFor(d), sets: {}, hsBest: "" };
  const dr = S.draft; const plan = PLAN[dr.type]; const doneToday = S.sessions.find(s => s.date === d && s.type !== "T");
  const hsP = HS[hsPhase()]; const sec = hsToday(d); const pct = Math.min(100, sec / 900 * 100);
  const yesterday = iso(new Date(Date.now() - 864e5));
  let html = `<div class="row"><span class="eyebrow grow">${esc(DAYS[new Date(d + "T12:00:00").getDay()])} · ${d === today() ? "hoje" : d.slice(8, 10) + "/" + d.slice(5, 7)}</span>
    <select id="selDate" style="width:auto" class="small"><option value="${today()}" ${d === today() ? "selected" : ""}>Hoje</option><option value="${yesterday}" ${d === yesterday ? "selected" : ""}>Ontem</option></select>
    <select id="selType" style="width:auto" class="small">${Object.keys(PLAN).map(k => `<option value="${k}" ${k === dr.type ? "selected" : ""}>${esc(PLAN[k].title)}</option>`).join("")}</select></div>`;
  if (doneToday) html += `<div class="card done"><div class="row"><span class="pill good">Treino salvo</span><span class="muted small">${esc(PLAN[doneToday.type]?.title || "")}</span></div><p class="small">${esc(doneToday.summary || "")}</p><button class="btn ghost sm" id="undoS">Desfazer e editar</button></div>`;
  // handstand block (every day except rest, and even on rest optional)
  html += `<div class="card">
    <div class="row"><span class="eyebrow grow">Handstand · ${esc(hsP.n)}</span><span class="pill on">meta: ${esc(hsP.goal)}</span></div>
    <div class="timer"><div class="t num" id="tmr">${mmss(sec)}</div><div class="bar${sec >= 600 ? " good" : ""}"><i style="width:${pct}%"></i></div>
      <div class="row"><button class="btn primary" id="tStart">${timer.run ? "Pausar" : sec ? "Continuar" : "Iniciar 10 a 15 min"}</button></div></div>
    <ul class="small">${hsP.drills.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="row"><div class="field grow"><label for="hsBest">Melhor tentativa de hoje (${hsP.metric === "wall" ? "parede, s" : hsP.metric === "free" ? "livre, s" : "passos ou metros"})</label><input class="num" type="number" inputmode="numeric" id="hsBest" value="${esc(dr.hsBest)}" placeholder="${hsP.metric === "wall" ? S.hs.wall || 0 : hsP.metric === "free" ? S.hs.free || 0 : S.hs.walk || 0}"></div><button class="btn" id="hsSave">Anotar</button></div>
    <p class="muted small">Recorde: parede ${S.hs.wall || 0} s · livre ${S.hs.free || 0} s · caminhada ${S.hs.walk || 0} m.</p></div>`;
  if (dr.type === "R") {
    html += `<div class="card"><h2>Descanso</h2><p class="muted">Hoje só o handstand curto, se quiser, e caminhada. Trocar o tipo lá em cima se for treinar mesmo assim.</p></div>`;
  } else {
    html += `<div class="card accent"><div class="row"><span class="eyebrow grow">${esc(plan.where)}</span>${plan.light ? `<span class="pill">leve</span>` : ""}</div><h2>${esc(plan.title)}</h2>
      <div><span class="lbl">Aquecimento</span><ul class="small">${plan.warm.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>`;
    plan.ex.forEach((k, idx) => {
      const lib = LIB[k]; let lv = S.lvl[k]; let step = lib.ladder[lv];
      // Session C swaps pull to the explosive variant when strict pull-ups exist
      if (dr.type === "C" && k === "pull" && lv >= 4 && lv < 7) { step = Object.assign({}, lib.ladder[lv], { n: lib.ladder[lv].n + " (ritmo explosivo)", note: "Suba o mais rápido possível, desça em 2 s. Séries curtas." }); }
      const vals = dr.sets[k] || Array(step.sets).fill("");
      const ladder = lib.ladder.map((_, i) => `<i class="${i < lv ? "on" : i === lv ? "cur" : ""}"></i>`).join("");
      html += `<div class="card" data-ex="${k}">
        <div class="row"><span class="eyebrow grow">${esc(lib.name)} · nível ${lv + 1} de ${lib.ladder.length}</span><span class="pill">${step.sets} x ${step.min === step.max ? step.max : step.min + " a " + step.max} ${step.unit}</span></div>
        <div class="lvl">${ladder}</div>
        <h3>${esc(step.n)}</h3>${step.note ? `<p class="muted small">${esc(step.note)}</p>` : ""}
        <div class="sets" style="--n:${step.sets}">${vals.map((v, i) => `<div class="s"><span>Série ${i + 1}</span><input class="num" type="number" inputmode="numeric" data-k="${k}" data-i="${i}" value="${esc(v)}" placeholder="${step.max}"></div>`).join("")}</div>
        <div class="row"><button class="btn sm" data-rest="${lib.rest}">Descansar ${lib.rest >= 60 ? Math.floor(lib.rest / 60) + " min" + (lib.rest % 60 ? " " + lib.rest % 60 + " s" : "") : lib.rest + " s"}</button><button class="btn sm ghost" data-fig="${k}">${lib.fig ? "Ver desenho" : ""}</button><span class="grow"></span>${lv > 0 ? `<button class="btn sm ghost" data-down="${k}">Mais fácil</button>` : ""}${lv < lib.ladder.length - 1 ? `<button class="btn sm ghost" data-up="${k}">Mais difícil</button>` : ""}</div>
        <div class="figwrap" hidden>${lib.fig && FIGS[lib.fig] ? `<div class="figs">${figbox(FIGS[lib.fig][0])}${figbox(FIGS[lib.fig][1], lib.fig === "Prancha")}</div>` : ""}</div></div>`;
    });
    html += `<div class="card"><div class="field"><label for="wIn">Peso de hoje (kg), opcional</label><div class="row"><input class="grow num" type="number" inputmode="decimal" step="0.1" id="wIn" placeholder="${fmtKg(S.weight)}" value="${esc(dr.w || "")}"><input class="num" style="width:120px" type="number" inputmode="decimal" id="cIn" placeholder="cintura cm" value="${esc(dr.c || "")}"></div></div>
      <button class="btn good big" id="finish">${doneToday ? "Salvar alterações" : "Concluir treino"}</button>
      <p class="muted small">Ao concluir, o app compara com a meta de cada exercício e sobe ou desce o nível sozinho. Séries em branco contam como não feitas.</p></div>`;
  }
  $("#tab-hoje").innerHTML = html;
  // handlers
  $("#selDate").onchange = e => { S.draft = { date: e.target.value, type: sessionFor(e.target.value), sets: {}, hsBest: "" }; save(); renderHoje(); };
  $("#selType").onchange = e => { dr.type = e.target.value; dr.sets = {}; save(); renderHoje(); };
  $("#tStart").onclick = () => { if (timer.run) { S.hs.log[d] = { sec: hsToday(d) }; timer.run = false; clearInterval(timer.id); } else { timer.run = true; timer.start = Date.now(); timer.id = setInterval(tick, 500); } save(); renderHoje(); };
  $("#hsBest").oninput = e => { dr.hsBest = e.target.value; save(); };
  $("#hsSave").onclick = () => { const v = parseFloat($("#hsBest").value); if (!v) return; const m = HS[hsPhase()].metric; const before = hsPhase(); if (v > (S.hs[m] || 0)) { S.hs[m] = v; toast(`Novo recorde: ${v}${m === "walk" ? " m" : " s"}`); } S.hs.log[d] = Object.assign(S.hs.log[d] || {}, { best: v, metric: m }); save(); renderHeader(); if (hsPhase() > before) toast(`Subiu para a ${HS[hsPhase()].n}`); renderHoje(); };
  const undo = $("#undoS"); if (undo) undo.onclick = () => { const se = S.sessions.find(s => s.date === d && s.type !== "T"); if (!se) return; S.lvl = Object.assign(S.lvl, se.lvlBefore || {}); S.streak = se.streakBefore || S.streak; dr.sets = {}; for (const e of se.entries) dr.sets[e.ex] = e.sets.map(v => v || ""); dr.type = se.type; S.sessions = S.sessions.filter(s => s !== se); save(); renderHeader(); renderHoje(); };
  $("#tab-hoje").querySelectorAll("input[data-k]").forEach(inp => inp.oninput = () => { const k = inp.dataset.k; const n = LIB[k].ladder[S.lvl[k]].sets; dr.sets[k] = dr.sets[k] || Array(n).fill(""); dr.sets[k][+inp.dataset.i] = inp.value; save(); });
  $("#tab-hoje").querySelectorAll("[data-rest]").forEach(b => b.onclick = () => startRest(+b.dataset.rest));
  $("#tab-hoje").querySelectorAll("[data-fig]").forEach(b => b.onclick = () => { const w = b.closest(".card").querySelector(".figwrap"); w.hidden = !w.hidden; b.textContent = w.hidden ? "Ver desenho" : "Esconder"; });
  $("#tab-hoje").querySelectorAll("[data-up]").forEach(b => b.onclick = () => { S.lvl[b.dataset.up]++; S.streak[b.dataset.up] = 0; dr.sets[b.dataset.up] = null; save(); renderHoje(); });
  $("#tab-hoje").querySelectorAll("[data-down]").forEach(b => b.onclick = () => { S.lvl[b.dataset.down]--; S.streak[b.dataset.down] = 0; dr.sets[b.dataset.down] = null; save(); renderHoje(); });
  const w = $("#wIn"); if (w) { w.oninput = () => { dr.w = w.value; save(); }; $("#cIn").oninput = () => { dr.c = $("#cIn").value; save(); }; }
  const f = $("#finish"); if (f) f.onclick = finishSession;
}
function tick() { const el = $("#tmr"); if (!el || !S.draft) return; const sec = hsToday(S.draft.date); el.textContent = mmss(sec); const b = $(".bar i", $("#tab-hoje")); if (b) b.style.width = Math.min(100, sec / 900 * 100) + "%"; }

function finishSession() {
  const dr = S.draft; const plan = PLAN[dr.type]; const entries = []; const msgs = []; const lvlBefore = Object.assign({}, S.lvl); const streakBefore = Object.assign({}, S.streak);
  for (const k of plan.ex) {
    const lv = S.lvl[k]; const step = LIB[k].ladder[lv]; const raw = dr.sets[k] || []; const sets = Array.from({ length: step.sets }, (_, i) => parseFloat(raw[i]) || 0);
    if (!sets.some(v => v > 0)) continue;
    entries.push({ ex: k, lvl: lv, sets });
    const allMax = sets.every(v => v >= step.max), allBelow = sets.every(v => v < step.min);
    if (allMax) { S.streak[k] = (S.streak[k] || 0) + 1; if (S.streak[k] >= 2 && lv < LIB[k].ladder.length - 1) { S.lvl[k] = lv + 1; S.streak[k] = 0; msgs.push(`${LIB[k].name}: subiu para “${LIB[k].ladder[lv + 1].n}”`); } else if (lv < LIB[k].ladder.length - 1) msgs.push(`${LIB[k].name}: meta batida (${S.streak[k]} de 2)`); }
    else if (allBelow && lv > 0) { S.lvl[k] = lv - 1; S.streak[k] = 0; msgs.push(`${LIB[k].name}: volta um degrau para “${LIB[k].ladder[lv - 1].n}”. Normal.`); }
    else S.streak[k] = 0;
  }
  if (!entries.length && dr.type !== "H") { toast("Anote pelo menos uma série antes de concluir"); return; }
  const kg = parseFloat(dr.w), cm = parseFloat(dr.c);
  if (kg || cm) { S.log = S.log.filter(x => x.d !== dr.date); S.log.push({ d: dr.date, kg: kg || null, cm: cm || null }); S.log.sort((a, b) => a.d < b.d ? -1 : 1); if (kg) S.weight = kg; if (cm) S.waist = cm; }
  const muBefore = muPhase();
  S.sessions = S.sessions.filter(s => !(s.date === dr.date && s.type !== "T"));
  S.sessions.push({ date: dr.date, type: dr.type, entries, summary: msgs.length ? msgs.join(" · ") : "Dentro da faixa. Repita e tente chegar ao topo da faixa em todas as séries.", lvlBefore, streakBefore });
  S.sessions.sort((a, b) => a.date < b.date ? -1 : 1);
  if (muPhase() > muBefore) msgs.unshift(`Muscle-up: entrou na ${MU_PH[muPhase()].n}`);
  S.draft = null; save(); renderHeader(); renderHoje(); toast(msgs.length ? msgs[0] : "Treino salvo");
}

// rest timer
let rest = { end: 0, id: null };
function startRest(sec) { rest.end = Date.now() + sec * 1000; $("#rest").hidden = false; clearInterval(rest.id); rest.id = setInterval(restTick, 250); restTick(); }
function restTick() { const left = Math.max(0, Math.round((rest.end - Date.now()) / 1000)); $("#restT").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; if (left <= 0) { clearInterval(rest.id); $("#rest").hidden = true; toast("Descanso acabou. Próxima série."); if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (e) {} } }
$("#restPlus").onclick = () => { rest.end += 30000; restTick(); };
$("#restStop").onclick = () => { clearInterval(rest.id); $("#rest").hidden = true; };

// ---------------------------------------------------------------- progresso
function renderProgresso() {
  const mu = muPhase(), hs = hsPhase();
  const days = 28; const start = new Date(); start.setDate(start.getDate() - (days - 1));
  const cells = []; for (let i = 0; i < days; i++) { const d = iso(new Date(start.getTime() + i * 864e5)); const se = S.sessions.find(s => s.date === d && s.type !== "T"); const hsl = S.hs.log[d]; cells.push(`<div class="${se ? "on" : hsl ? "hs" : ""}${d === today() ? " today" : ""}" title="${d}">${se ? se.type : new Date(d + "T12:00:00").getDate()}</div>`); }
  const last7 = S.sessions.filter(s => s.type !== "T" && (Date.now() - new Date(s.date + "T12:00:00")) < 7 * 864e5).length;
  const since = S.start ? Math.floor((Date.now() - new Date(S.start + "T12:00:00")) / 864e5) : 0;
  const logs = S.log.slice(-30);
  const levels = Object.keys(LIB).map(k => { const lv = S.lvl[k]; const lib = LIB[k]; return `<tr><td>${esc(lib.name)}</td><td>${esc(lib.ladder[lv].n)}</td><td class="num">${lv + 1}/${lib.ladder.length}${S.streak[k] ? ` <span class="pill good">${S.streak[k]}/2</span>` : ""}</td></tr>`; }).join("");
  const prs = [["Barra estrita", pr(S, "pull", 4) + " reps"], ["Dip nas paralelas", pr(S, "dip", 3) + " reps"], ["Flexão", pr(S, "push", 0) + " reps"], ["Parede", (S.hs.wall || 0) + " s"], ["Livre", (S.hs.free || 0) + " s"], ["Peso", fmtKg(S.weight) + " kg"]];
  $("#tab-progresso").innerHTML = `
  <div class="card"><div class="kpis"><div class="kpi"><div class="v num">${since}</div><div class="l">dias desde o início</div></div><div class="kpi"><div class="v num">${S.sessions.filter(s => s.type !== "T").length}</div><div class="l">treinos salvos</div></div><div class="kpi"><div class="v num">${last7}</div><div class="l">treinos nos últimos 7 dias</div></div></div>
    <div class="eyebrow">Últimas 4 semanas</div><div class="cal">${cells.join("")}</div><p class="muted small">Laranja: treino salvo (A, B, C ou H). Claro: só handstand. Meta: 3 treinos de força e handstand todo dia.</p></div>
  <div class="card"><h2>Trilha do muscle-up</h2><p class="muted small">A fase sobe sozinha quando os critérios são batidos nos treinos. Marque à mão o que o app não consegue medir.</p>
    ${MU_PH.map((p, i) => `<div class="phase${i === mu ? " cur" : i < mu ? " ok" : ""}"><div class="ph"><h3>${esc(p.n)}</h3>${i === mu ? `<span class="pill on">você está aqui</span>` : i < mu ? `<span class="pill good">concluída</span>` : ""}</div>
      ${p.crit.map(c => { const a = c.auto ? c.auto(S) : false; const ok = critDone(c); return `<label class="crit${ok ? " ok" : ""}"><input type="checkbox" data-crit="${c.k}" ${ok ? "checked" : ""} ${a ? "disabled" : ""}><span>${esc(c.t)}${a ? ` <span class="auto">· medido nos treinos</span>` : c.auto ? ` <span class="auto">· o app mede quando você chegar nesse exercício</span>` : ""}</span></label>`; }).join("")}</div>`).join("")}
    <div class="figs three">${FIGS._muscleup.map(p => figbox(p)).join("")}</div></div>
  <div class="card"><h2>Trilha do handstand</h2><p class="muted small">A fase sobe pelo seu recorde de segundos: parede 20 s abre a fase 1, parede 60 s abre a fase 2, 5 s livre abre a fase 3, 30 s livre abre a caminhada.</p>
    ${HS.map((p, i) => `<div class="phase${i === hs ? " cur" : i < hs ? " ok" : ""}"><div class="ph"><h3>${esc(p.n)}</h3>${i === hs ? `<span class="pill on">você está aqui</span>` : i < hs ? `<span class="pill good">concluída</span>` : ""}</div><div class="small">Sai quando: ${esc(p.goal)}</div></div>`).join("")}
    <label class="crit${critOk("hs_kick") ? " ok" : ""}"><input type="checkbox" data-crit="hs_kick" ${critOk("hs_kick") ? "checked" : ""}><span>Entrada com chute parando perto da parede sem bater, e saída (cambalhota ou estrela) automática</span></label>
    <div class="figs">${FIGS._handstand.map(p => figbox(p)).join("")}</div></div>
  <div class="card"><h2>Nível atual por exercício</h2><div class="twrap"><table><thead><tr><th>Padrão</th><th>Degrau atual</th><th>Nível</th></tr></thead><tbody>${levels}</tbody></table></div><p class="muted small">Regra: todas as séries no topo da faixa em 2 treinos seguidos sobe um degrau. Todas abaixo do mínimo desce um. Você também pode ajustar à mão na tela do treino.</p></div>
  <div class="card"><h2>Recordes</h2><div class="kpis">${prs.map(p => `<div class="kpi"><div class="v num">${esc(p[1])}</div><div class="l">${esc(p[0])}</div></div>`).join("")}</div></div>
  <div class="card"><h2>Peso e cintura</h2>${logs.length > 1 ? spark(logs) : `<p class="muted small">Anote o peso ao concluir um treino. Com dois ou mais dias aparece o gráfico.</p>`}
    <p class="small">Massa magra estimada <input class="num" type="number" inputmode="decimal" step="0.5" id="leanIn" value="${S.lean}" style="width:80px;display:inline-block;padding:4px 8px"> kg. Definido para você: <b>${fmtKg(S.lean / 0.88)} a ${fmtKg(S.lean / 0.85)} kg</b> (12% a 15%). Gordura estimada hoje: ~${Math.round((1 - S.lean / S.weight) * 100)}%.</p>
    ${logs.length ? `<div class="twrap"><table><thead><tr><th>Dia</th><th>kg</th><th>cintura</th><th></th></tr></thead><tbody>${logs.slice().reverse().slice(0, 10).map(l => `<tr><td>${l.d.slice(8, 10)}/${l.d.slice(5, 7)}</td><td class="num">${l.kg ? fmtKg(l.kg) : "–"}</td><td class="num">${l.cm || "–"}</td><td><button class="btn sm ghost" data-del="${l.d}">×</button></td></tr>`).join("")}</tbody></table></div>` : ""}</div>
  <div class="card"><h3>Histórico</h3>${S.sessions.length ? S.sessions.slice().reverse().slice(0, 15).map(s => `<details><summary>${s.date.slice(8, 10)}/${s.date.slice(5, 7)} · ${esc(PLAN[s.type]?.title || s.note || "Teste")}</summary><div class="body small">${(s.entries || []).map(e => `<div><b>${esc(LIB[e.ex].ladder[e.lvl].n)}</b>: ${e.sets.join(" / ")}</div>`).join("")}${s.summary ? `<div class="muted">${esc(s.summary)}</div>` : ""}</div></details>`).join("") : `<p class="muted small">Nenhum treino salvo ainda.</p>`}
    <div class="row"><button class="btn ghost sm" id="clearAll">Apagar todos os dados do app</button></div></div>`;
  $("#tab-progresso").querySelectorAll("[data-crit]").forEach(c => c.onchange = () => { S.crit[c.dataset.crit] = c.checked; save(); renderHeader(); renderProgresso(); });
  $("#leanIn").onchange = e => { S.lean = parseFloat(e.target.value) || S.lean; save(); renderHeader(); renderProgresso(); };
  $("#tab-progresso").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.log = S.log.filter(x => x.d !== b.dataset.del); save(); renderProgresso(); });
  $("#clearAll").onclick = () => { const b = $("#clearAll"); if (b.dataset.arm) { try { localStorage.removeItem(KEY); localStorage.removeItem("tingui.skills.v1"); } catch (e) {} location.reload(); } else { b.dataset.arm = "1"; b.textContent = "Toque de novo para confirmar"; } };
}
function spark(logs) {
  const pts = logs.filter(l => l.kg); if (pts.length < 2) return "";
  const W = 320, H = 70, p = 8; const ks = pts.map(l => l.kg); const min = Math.min(...ks) - 0.5, max = Math.max(...ks) + 0.5;
  const x = i => p + i * (W - 2 * p) / (pts.length - 1), y = k => H - p - (k - min) / (max - min) * (H - 2 * p);
  const d = pts.map((l, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(l.kg).toFixed(1)}`).join(" ");
  const area = d + ` L${x(pts.length - 1).toFixed(1)},${H - p} L${x(0).toFixed(1)},${H - p} Z`; const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(pts.length - 1)}" cy="${y(last.kg)}" r="3.5" fill="var(--accent)"/><text x="${p}" y="${p + 4}" font-size="10" fill="var(--muted)" font-family="inherit">${fmtKg(max - 0.5)}</text><text x="${p}" y="${H - 2}" font-size="10" fill="var(--muted)" font-family="inherit">${fmtKg(min + 0.5)}</text></svg>`;
}

// ---------------------------------------------------------------- guia
function renderGuia() {
  const exCards = Object.keys(LIB).map(k => { const lib = LIB[k]; return `<details><summary>${esc(lib.name)}</summary><div class="body">${lib.fig && FIGS[lib.fig] ? `<div class="figs">${figbox(FIGS[lib.fig][0])}${figbox(FIGS[lib.fig][1], lib.fig === "Prancha")}</div>` : ""}<div><span class="lbl">Escada de progressões</span><ol class="small">${lib.ladder.map((s, i) => `<li${i === S.lvl[k] ? ' style="font-weight:600"' : ""}>${esc(s.n)} <span class="muted">${s.sets} x ${s.min === s.max ? s.max : s.min + " a " + s.max} ${s.unit}</span>${s.note ? `<div class="muted">${esc(s.note)}</div>` : ""}</li>`).join("")}</ol></div></div></details>`; }).join("");
  $("#tab-guia").innerHTML = `
  <div class="card"><h2>Como o app funciona</h2><ul class="small">
    <li><b>Abra e treine.</b> A aba Hoje já sabe o dia da semana, escolhe a sessão e mostra o degrau certo de cada exercício. Anote as repetições de cada série e toque em Concluir.</li>
    <li><b>Ele decide o nível.</b> Todas as séries no topo da faixa em 2 treinos seguidos sobe um degrau. Todas abaixo do mínimo desce um. Quer forçar? Use Mais fácil ou Mais difícil.</li>
    <li><b>Ele decide a fase.</b> Muscle-up: pelos recordes de barra, dip, chest-to-bar e negativa de muscle-up anotados. Handstand: pelos segundos de parede e livre que você anota no cronômetro.</li>
    <li><b>Descanso.</b> O botão Descansar abre um cronômetro no rodapé e vibra ao acabar.</li>
    <li><b>Ontem.</b> Esqueceu de anotar? Em Hoje, troque para Ontem no seletor de data.</li>
    <li>Tudo fica salvo neste aparelho. Não vai para outro celular nem para mim. Para eu ajustar o plano, me mande os números da aba Progresso.</li></ul></div>
  <div class="card"><h2>Semana</h2><div class="twrap"><table><thead><tr><th>Dia</th><th>Sessão</th><th>Onde</th></tr></thead><tbody>${[1, 2, 3, 4, 5, 6, 0].map(i => `<tr><td>${DAYS[i]}</td><td>${esc(PLAN[WEEKPLAN[i]].title)}${WEEKPLAN[i] !== "R" ? " + handstand" : ""}</td><td>${esc(PLAN[WEEKPLAN[i]].where)}</td></tr>`).join("")}</tbody></table></div>
    <ul class="small"><li>Rotina de desempregado funciona melhor com horário fixo: mesmo horário todo dia, de preferência de manhã, antes de abrir e-mail e LinkedIn. Treino vira âncora do dia.</li><li>Sessões A, B e C levam 60 a 75 min com o trajeto. Sessões H levam 30 a 40 min.</li><li>Trajeto de casa até as barras do setor São João: 1,8 km em linha reta, 2,1 a 2,4 km a pé. Meça uma vez com o Nike Run Club e repita o caminho.</li><li>Chuva: faça a sessão em casa com mesa firme (remada), cadeira (dip, pés elevados) e porta (handstand). Pular é pior que adaptar.</li></ul></div>
  <div class="card"><h2>Equipamento com o dinheiro do Wellhub</h2><p class="muted small">Os R$ 199,90 de um mês compram tudo o que este plano precisa, de uma vez só.</p><div class="twrap"><table><thead><tr><th>Item</th><th>Para quê</th><th>Faixa de preço</th></tr></thead><tbody>
    <tr><td>Faixa elástica de barra (média e fina)</td><td>Barra assistida e muscle-up com faixa</td><td>R$ 40 a 90 o par</td></tr>
    <tr><td>Mochila firme + garrafas de 2 L ou anilhas usadas</td><td>Barra, dip e búlgaro com carga. Cada garrafa cheia pesa 2 kg</td><td>R$ 0 a 60</td></tr>
    <tr><td>Magnésio em bloco</td><td>Pegada na barra cromada e false grip</td><td>R$ 15 a 30</td></tr>
    <tr><td>Parallettes baixas ou dois blocos de ioga</td><td>L-sit, punhos no handstand, pike push-up</td><td>R$ 60 a 150</td></tr>
    <tr><td>Toalha pequena e garrafa de água</td><td>Secar a barra, forrar o chão</td><td>Já tem</td></tr></tbody></table></div></div>
  <div class="card"><h2>Exercícios e escadas</h2><p class="muted small">O degrau em negrito é o seu nível atual. Desenhos: esquerda início, direita fim.</p>${exCards}</div>
  <div class="card"><h2>Cuidados</h2><ul class="small">
    <li><b>Cotovelo:</b> carga na barra sobe no máximo 2,5 kg por semana. Dor na parte interna que não some em 48 h: pegada neutra ou supinada por 2 semanas e metade do volume.</li>
    <li><b>Ombro:</b> remada em todo treino e alongamento de peitoral diário. Você tem muito peitoral e ombros à frente.</li>
    <li><b>Punho:</b> dor leve nas 3 primeiras semanas de handstand é normal. Dor aguda, não. Aqueça e pare o dia se doer durante.</li>
    <li><b>Déficit:</b> 2 g de proteína por kg (${Math.round(S.weight * 2)} g), carboidrato em volta do treino, 0,5 a 0,7 kg por semana. Força na barra caindo 2 semanas seguidas: coma 200 kcal a mais.</li>
    <li><b>Mãos:</b> barra na dobra dos dedos, não no meio da palma. Lixe calos depois do banho. Bolha aberta: encerre a barra no dia.</li></ul></div>`;
}

// ---------------------------------------------------------------- nav
function show(tab) {
  S.tab = tab; save();
  document.querySelectorAll("main .tab").forEach(s => s.hidden = s.id !== "tab-" + tab);
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({ hoje: renderHoje, progresso: renderProgresso, guia: renderGuia })[tab]();
  window.scrollTo(0, 0);
}
$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.tab); };
renderHeader();
const h = (location.hash || "").slice(1);
show(["hoje", "progresso", "guia"].includes(h) ? h : "hoje");
</script>
</body></html>
